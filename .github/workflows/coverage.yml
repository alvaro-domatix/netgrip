name: coverage

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# El contexto `secrets` no es válido en el `if` de un step (fallaba el
# workflow entero al hacer push); se expone como `env` a nivel workflow y
# el step comprueba esa variable. Sin token (app Codecov aún no conectada)
# el upload se omite y el resto del job sigue verde.
env:
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

jobs:
  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build frontend
        working-directory: app
        run: npm ci && npm run build

      - name: Test frontend
        working-directory: app
        run: npm test

      - name: Run tests with coverage
        run: go test -race -count=1 -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.txt
          fail_ci_if_error: false
